name: CI/CD Pipeline for Serene Dashboard

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Updated to a more recent version

      - name: Set up Node.js
        uses: actions/setup-node@v4 # Updated to a more recent version
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm test -- --runInBand

      # Production Pages is configured from main / (root), verified in repository
      # Pages settings. The native pages-build-deployment workflow owns publishing.
      # Do not also push gh-pages or widen token permissions for a redundant path.
