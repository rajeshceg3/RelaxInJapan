name: Journal verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  journal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npx playwright install --with-deps chromium
      - run: node tests/journal-browser.mjs
      - run: node tests/quick-links-browser.mjs
      - run: node tests/timer-browser.mjs
      - run: node tests/calm-browser.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Verify original stored bytes across views
        run: |
          python3 -m http.server 4213 > /tmp/calm-server.log 2>&1 &
          node tests/calm-data.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-evidence
          path: |
            docs/journal-recovery/
            docs/quick-links-recovery/
            docs/timer-actions/
            docs/calm-experience/
          retention-days: 14
